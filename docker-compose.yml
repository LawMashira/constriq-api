services:
  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: constriq
    ports:
      - "5432:5432"
    volumes:
      - constriq_pg:/var/lib/postgresql/data

volumes:
  constriq_pg:
